# Local development database. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: playduelio
      POSTGRES_PASSWORD: playduelio
      POSTGRES_DB: playduelio
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U playduelio']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
