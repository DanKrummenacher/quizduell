# Categories of the automatically generated release notes (GitHub releases).
changelog:
  exclude:
    labels: [dependencies]
  categories:
    - title: Neu
      labels: [enhancement]
    - title: Behoben
      labels: [bug]
    - title: Dokumentation
      labels: [documentation]
    - title: CI und Betrieb
      labels: [ci]
    - title: Weitere Änderungen
      labels: ['*']
