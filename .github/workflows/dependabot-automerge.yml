# Dependabot pull requests: minor and patch updates are merged automatically
# once the CI is green (auto-merge, squash). Major updates stay open and get
# the label «needs-review», so a person looks at them.
name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto-merge minor and patch updates
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
      - name: Ask for a review of a major update
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: gh pr edit --add-label needs-review "$PR_URL"
