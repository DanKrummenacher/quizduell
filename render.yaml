# Infrastructure of playduelio on Render: production and the test environment.
# This file documents the services; they were created in the Render dashboard
# (Render → New → Blueprint → this repository applies it as well). Everything
# that is secret is `sync: false` and entered once in the Render dashboard.
#
# Deployments are triggered by GitHub (.github/workflows/deploy.yml) via deploy
# hooks: a green CI on main deploys the test environment, production follows
# after an approval. Auto-Deploy is therefore off on all services.
#
# The static site of the game must keep its URL (it is printed on QR codes):
# never delete and recreate it, only change its settings.
services:
  # ---------------------------------------------------------------- production
  - type: web
    name: playduelio-api
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: playduelio-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://playduelio.onrender.com
      # The one admin password, at least 12 characters (see docs/BETRIEB.md).
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: playduelio
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: '24'
      # Read access to the private @css-ch packages (GitHub token, read:packages).
      - key: GITHUB_TOKEN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains

  # ---------------------------------------------------------------------- test
  # Same code, own database, own admin password. Free plan: the API sleeps
  # after 15 minutes without traffic, the first call then takes about a minute.
  - type: web
    name: playduelio-api-test
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: playduelio-db-test
          property: connectionString
      - key: CORS_ORIGINS
        value: https://playduelio-test.onrender.com
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: playduelio-test
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build:test
    staticPublishPath: dist/frontend/browser
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: GITHUB_TOKEN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # The test environment must not end up in search engines.
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow

databases:
  - name: playduelio-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: '18'

  - name: playduelio-db-test
    region: frankfurt
    plan: free
    postgresMajorVersion: '18'
