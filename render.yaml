# Infrastructure of playduelio on Render, applied as a Blueprint
# (Render → New → Blueprint → this repository). Everything that is secret is
# `sync: false` and entered once in the Render dashboard.
#
# The static site of the game must keep its URL (it is printed on QR codes):
# never delete and recreate it, only change its settings.
services:
  - type: web
    name: playduelio-api
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: playduelio-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://playduelio.onrender.com
      # The admin password of the first start; afterwards it is changed in the
      # admin. See docs/BETRIEB.md to reset a forgotten one.
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: playduelio
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: '24'
      # Read access to the private @css-ch packages (GitHub token, read:packages).
      - key: GITHUB_TOKEN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains

databases:
  - name: playduelio-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: '18'
