<header class="header">
  <div class="bar">
    <span class="lockup">
      <app-logo-mark class="logo" [inverse]="true" />
      <span class="wordmark"><span class="light">play</span>duelio</span>
      <span class="chip">Studio</span>
    </span>

    <nav class="tabs" aria-label="Admin-Navigation">
      <button
        type="button"
        class="tab"
        [class.active]="view() === 'questions'"
        [attr.aria-current]="view() === 'questions' ? 'page' : null"
        (click)="view.set('questions')"
      >
        Fragen
      </button>
      <button
        type="button"
        class="tab"
        [class.active]="view() === 'rules'"
        [attr.aria-current]="view() === 'rules' ? 'page' : null"
        (click)="view.set('rules')"
      >
        Spielregeln
      </button>
    </nav>

    <div class="tools">
      <button
        type="button"
        class="tool"
        aria-label="Zum Spiel"
        title="Zum Spiel"
        (click)="openGame.emit()"
      >
        <css-icon icon="home" size="sm"></css-icon>
      </button>
      <button
        type="button"
        class="tool"
        aria-label="Abmelden"
        title="Abmelden"
        (click)="logout.emit()"
      >
        <css-icon icon="logout" size="sm"></css-icon>
      </button>
    </div>
  </div>

  <!-- Live state as a strip, always in view -->
  <div class="strip" role="status">
    <span class="state" [class.warning]="store.ready() === false">
      <span class="dot"></span>
      {{
        store.ready() === false
          ? 'Nicht spielbar – es fehlen ' + store.missingQuestions() + ' Fragen'
          : 'Bereit'
      }}
    </span>
    <dl class="figures">
      @for (item of strip(); track item.label) {
        <div class="figure" [class.live]="item.live">
          <dt>{{ item.label }}</dt>
          <dd>{{ item.value }}</dd>
        </div>
      }
    </dl>
  </div>
</header>

<main class="main">
  @if (view() === 'questions') {
    <app-studio-questions />
  } @else {
    <app-studio-rules />
  }
</main>

@if (store.message(); as m) {
  <css-notification
    class="toast"
    size="sm"
    [variant]="m.variant"
    [title]="m.text"
    ariaLabelCloseButton="Schliessen"
    (close)="store.message.set(null)"
  ></css-notification>
}
