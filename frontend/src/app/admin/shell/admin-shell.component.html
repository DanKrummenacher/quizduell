<div class="page">
  <app-brand-header label="Admin" />

  <div class="nav-row">
    <nav class="nav" aria-label="Admin-Navigation">
      @for (link of links; track link.path) {
        <a
          class="nav-link"
          [routerLink]="link.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
        >
          <css-icon [icon]="link.icon" size="sm"></css-icon>
          <span>{{ link.label }}</span>
        </a>
      }
    </nav>
    <css-button
      variant="plain"
      class="logout"
      ariaLabel="Abmelden"
      (click)="logout()"
    >
      <css-icon icon="logout" slot="prefix"></css-icon>
      <span class="logout-label">Abmelden</span>
    </css-button>
  </div>

  <main class="main">
    <router-outlet />
  </main>
</div>
