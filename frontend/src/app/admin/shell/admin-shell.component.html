<div class="page">
  <app-brand-header label="Admin" align="start" />

  <div class="nav-row">
    <nav class="nav" aria-label="Admin-Navigation">
      @for (link of links; track link.path) {
        <a
          class="nav-link"
          [routerLink]="link.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
        >
          <css-icon [icon]="link.icon" size="sm"></css-icon>
          <span>{{ link.label }}</span>
        </a>
      }
    </nav>
    <div class="nav-actions">
      <css-button
        variant="plain"
        class="nav-action"
        ariaLabel="Zum Spiel"
        (click)="openGame()"
      >
        <css-icon icon="home" slot="prefix"></css-icon>
        Zum Spiel
      </css-button>
      <css-button
        variant="plain"
        class="nav-action"
        ariaLabel="Abmelden"
        (click)="logout()"
      >
        <css-icon icon="logout" slot="prefix"></css-icon>
        Abmelden
      </css-button>
    </div>
  </div>

  <main class="main">
    <router-outlet />
  </main>
</div>
