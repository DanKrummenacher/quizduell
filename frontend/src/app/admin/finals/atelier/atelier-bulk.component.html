@if (pro.selected().size > 0) {
  <div class="bulk" role="region" aria-label="Auswahl">
    <span class="bulk-count">{{ pro.selected().size }} ausgewählt</span>
    @if (pro.progress(); as p) {
      <span class="bulk-progress"
        ><span [style.width.%]="(p.done / p.total) * 100"></span
      ></span>
    } @else if (confirmDelete()) {
      <span class="bulk-confirm">Endgültig löschen?</span>
      <button type="button" (click)="confirmDelete.set(false)">Nein</button>
      <button type="button" class="danger" (click)="bulkDelete()">Löschen</button>
    } @else {
      <button type="button" (click)="bulkActive(true)">Aktivieren</button>
      <button type="button" (click)="bulkActive(false)">Pausieren</button>
      <label class="bulk-move">
        <span class="visually-hidden">Verschieben nach</span>
        <select (change)="bulkMove(value($event)); $any($event.target).value = ''">
          <option value="">Verschieben …</option>
          @for (name of store.categories(); track name) {
            <option [value]="name">{{ name }}</option>
          }
          <option [value]="none">Ohne Kategorie</option>
        </select>
      </label>
      <button type="button" (click)="pro.exportCsv(pro.selectedQuestions())">
        Exportieren
      </button>
      <button type="button" class="danger-text" (click)="confirmDelete.set(true)">
        Löschen
      </button>
    }
    <button
      type="button"
      class="bulk-close"
      aria-label="Auswahl aufheben"
      (click)="pro.clear(); confirmDelete.set(false)"
    >
      <css-icon icon="close" size="sm"></css-icon>
    </button>
  </div>
}
