<header class="header">
  <div class="inner" [class.with-label]="label()">
    <span class="side start"><ng-content select="[headerStart]" /></span>
    <span class="lockup">
      <app-logo-mark class="logo" [inverse]="true" />
      <span class="wordmark"><span class="light">play</span>duelio</span>
    </span>
    <span class="side end">
      @if (label(); as text) {
        <span class="chip">{{ text }}</span>
      }
      <ng-content select="[headerEnd]" />
    </span>
  </div>
</header>
