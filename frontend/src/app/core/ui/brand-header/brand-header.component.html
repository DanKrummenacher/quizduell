<header class="header" [class]="'header v' + variant()">
  <div class="inner">
    @switch (variant()) {
      @case (2) {
        <span class="lockup">
          <app-logo-mark class="logo" [inverse]="true" />
          <span class="wordmark"><span class="light">play</span>duelio</span>
        </span>
        <span class="chip">{{ subtitle() }}</span>
      }
      @case (5) {
        <span class="lockup">
          <app-logo-mark class="logo" [inverse]="true" />
          <span class="wordmark"><span class="light">play</span>duelio</span>
        </span>
      }
      @case (6) {
        <span class="lockup">
          <app-logo-mark class="logo" />
          <span class="wordmark"><span class="light">play</span>duelio</span>
        </span>
        <span class="caption">{{ subtitle() }}</span>
      }
      @default {
        <span class="lockup">
          <app-logo-mark class="logo" [tile]="true" />
          <span class="wordmark"><span class="light">play</span>duelio</span>
        </span>
      }
    }
  </div>
</header>
