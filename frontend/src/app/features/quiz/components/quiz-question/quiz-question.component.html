<h2 class="question-text">
  {{ questionText() }}
</h2>

<div class="answers-wrapper">
  @if (feedbackText()) {
    <div class="feedback-wrapper">
      <calc-text textSmall [class]="'feedback-' + feedbackType()">
        {{ feedbackText() }}
      </calc-text>
    </div>
  }

  <div class="answers-list">
    @for (answer of answers(); track answer.letter) {
      <button
        class="answer-card"
        [class.state-selected]="answer.state === 'selected'"
        [class.state-correct]="answer.state === 'correct'"
        [class.state-wrong]="answer.state === 'wrong'"
        (click)="answerSelected.emit(answer.letter)"
        [disabled]="phase() !== 'PLAYING'"
      >
        <div class="letter-box">
          <calc-text
            textSmall
            [attr.colorWhite]="answer.state !== 'default' ? '' : null"
          >
            {{ answer.letter }}
          </calc-text>
        </div>

        <calc-text
          textSmall
          [attr.textLead]="answer.state === 'default' ? '' : null"
          [attr.colorWhite]="answer.state !== 'default' ? '' : null"
        >
          {{ answer.text }}
        </calc-text>

        @if (answer.hasOpponent) {
          <div class="opponent-badge">
            <calc-text textSmall colorWhite>{{ opponentInitial() }}</calc-text>
          </div>
        }
      </button>
    }
  </div>
</div>
