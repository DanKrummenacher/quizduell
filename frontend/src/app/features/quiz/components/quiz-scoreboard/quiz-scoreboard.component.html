<div class="scoreboard">
  <div class="player-left">
    <div class="name-wrapper">
      <calc-text textMedium textLead class="player-name" [title]="playerName()">{{
        playerName()
      }}</calc-text>
      <calc-text textMedium textLead class="is-me-badge">&nbsp;(Du)</calc-text>
    </div>
    <calc-text class="player-score">{{ playerScore() }} Pkt.</calc-text>
  </div>

  <calc-text textSmall>vs.</calc-text>

  <div class="player-right">
    <div class="name-wrapper right-align">
      <calc-text textMedium textLead class="player-name" [title]="opponentName()">{{
        opponentName()
      }}</calc-text>
    </div>
    <calc-text class="player-score">{{ opponentScore() }} Pkt.</calc-text>
  </div>
</div>
