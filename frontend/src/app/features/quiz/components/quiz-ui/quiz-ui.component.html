<app-brand-header />

<main class="main-content">
  <app-quiz-status
    [variant]="headerVariant()"
    [playerName]="playerName()"
    [playerScore]="playerScore()"
    [opponentName]="opponentName()"
    [opponentScore]="opponentScore()"
    [currentQuestion]="currentQuestion()"
    [totalQuestions]="totalQuestions()"
    [timeLeft]="timeLeft()"
    [timerPercent]="timerPercent()"
    [isReveal]="quizPhase() === 'REVEAL'"
  />

  @if (opponentOffline()) {
    <calc-text textSmall class="opponent-offline" role="status">
      Verbindung zu {{ opponentName() }} unterbrochen – wir warten kurz …
    </calc-text>
  }

  <div class="question-wrapper">
    <app-quiz-question
      [phase]="quizPhase()"
      [questionText]="questionText()"
      [answers]="answers()"
      [feedbackText]="feedbackText()"
      [feedbackType]="feedbackType()"
      [opponentInitial]="opponentName().charAt(0).toUpperCase()"
      (answerSelected)="answerSelected.emit($event)"
    >
    </app-quiz-question>
  </div>
</main>

@if (opponentLeft()) {
  <css-flyout
    withoutCloseButton
    size="small"
    [title]="abortTitle()"
    [main]="abortText()"
  >
    <css-button
      variant="primary"
      slot="css-button"
      (click)="acknowledgeOpponentLeft.emit()"
    >
      Zum Spielmodus
    </css-button>
  </css-flyout>
}
