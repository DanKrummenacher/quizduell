<app-brand-header class="game-header">
  <span headerEnd class="header-nav header-progress"
    >Frage {{ currentQuestion() }}/{{ totalQuestions() }}</span
  >
</app-brand-header>

<main class="main-content">
  <calc-text textSmall class="progress-text"
    >Frage {{ currentQuestion() }} von {{ totalQuestions() }}</calc-text
  >

  <app-quiz-scoreboard
    [playerName]="playerName()"
    [playerScore]="playerScore()"
    [opponentName]="opponentName()"
    [opponentScore]="opponentScore()"
  >
  </app-quiz-scoreboard>

  @if (opponentOffline()) {
    <calc-text textSmall class="opponent-offline" role="status">
      Verbindung zu {{ opponentName() }} unterbrochen – wir warten kurz …
    </calc-text>
  }

  <app-quiz-timer
    [timeLeft]="timeLeft()"
    [timerPercent]="timerPercent()"
    [isReveal]="quizPhase() === 'REVEAL'"
  >
  </app-quiz-timer>

  <div class="question-wrapper">
    <app-quiz-question
      [phase]="quizPhase()"
      [questionText]="questionText()"
      [answers]="answers()"
      [feedbackText]="feedbackText()"
      [feedbackType]="feedbackType()"
      [opponentInitial]="opponentName().charAt(0).toUpperCase()"
      (answerSelected)="answerSelected.emit($event)"
    >
    </app-quiz-question>
  </div>
</main>

@if (opponentLeft()) {
  <css-flyout
    withoutCloseButton
    size="small"
    [title]="abortTitle()"
    [main]="abortText()"
  >
    <css-button
      variant="primary"
      slot="css-button"
      (click)="acknowledgeOpponentLeft.emit()"
    >
      Zum Spielmodus
    </css-button>
  </css-flyout>
}
