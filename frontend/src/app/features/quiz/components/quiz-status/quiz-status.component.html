<section class="status" [class.is-low]="isLow()" aria-label="Spielstand">
  <div class="faceoff">
    <div class="side me">
      <span class="avatar" aria-hidden="true">{{ playerInitial() }}</span>
      <span class="who">
        <span class="name"
          ><span class="name-text">{{ playerName() }}</span
          ><span class="you"> (Du)</span></span
        >
        <span class="points" [class.pop]="playerPop()"
          >{{ playerScore() }}<span class="unit"> Pkt.</span></span
        >
      </span>
    </div>

    <div class="side opponent">
      <span class="who">
        <span class="name"
          ><span class="name-text">{{ opponentName() }}</span></span
        >
        <span class="points" [class.pop]="opponentPop()"
          >{{ opponentScore() }}<span class="unit"> Pkt.</span></span
        >
      </span>
      <span class="avatar" aria-hidden="true">{{ opponentInitial() }}</span>
    </div>

    <!-- The question number sits in a diamond, one of the logo's shapes. -->
    <span class="clock" aria-hidden="true"
      ><span class="clock-value"
        >{{ currentQuestion() }}/{{ totalQuestions() }}</span
      ></span
    >
  </div>

  <div class="meta">
    <span class="visually-hidden"
      >Frage {{ currentQuestion() }} von {{ totalQuestions() }}</span
    >
    <span class="time" role="timer">{{ timeText() }}</span>
  </div>

  <div class="track" aria-hidden="true">
    <div
      class="progress"
      [style.width.%]="timerPercent()"
      [style.transition]="barTransition()"
    ></div>
  </div>
</section>
