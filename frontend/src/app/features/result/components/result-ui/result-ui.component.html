<main class="main-content">
  <div class="center-content">
    <div class="result-icon-box">
      <calc-icon [attr.icon]="statusIcon()" class="result-icon"></calc-icon>
    </div>

    <h1 class="result-title">{{ statusTitle() }}</h1>
    <calc-text textMedium class="result-subtitle">{{ statusSubtitle() }}</calc-text>

    <app-result-players [players]="players()"></app-result-players>
  </div>

  <div class="actions-wrapper">
    <calc-button expanded variant="primary" (click)="navigateHome.emit()">
      <calc-icon icon="home" slot="icon"></calc-icon>
      Zurück zur Lobby
    </calc-button>

    <div class="play-again-wrapper">
      <calc-button
        expanded
        variant="primary"
        class="play-again-button"
        [attr.disabled]="isPlayAgainDisabled() ? true : null"
        (click)="playAgain.emit()"
      >
        <calc-icon [attr.icon]="playAgainIcon()" slot="icon"></calc-icon>
        {{ playAgainText() }}
      </calc-button>

      <div class="play-again-status" [class.is-visible]="!!playAgainStatusText()">
        <calc-icon icon="info" class="status-icon"></calc-icon>
        <calc-text textMedium textLead class="status-text">{{
          playAgainStatusText()
        }}</calc-text>
      </div>
    </div>
  </div>
</main>

@if (showOpponentLeftFlyout()) {
  <calc-flyout
    withoutCloseButton
    size="small"
    title="Schade! Keine Revanche"
    main="Dein Gegner hat das Spiel verlassen oder nicht rechtzeitig reagiert."
  >
    <calc-button
      variant="primary"
      slot="calc-button"
      (click)="opponentLeftAcknowledge.emit()"
    >
      Zurück zur Lobby
    </calc-button>
  </calc-flyout>
}

@if (showSessionExpiredFlyout()) {
  <calc-flyout
    withoutCloseButton
    size="small"
    title="Spiel beendet"
    main="Diese Spielsitzung wurde beendet. Du kannst nun ein neues Spiel starten."
  >
    <calc-button
      variant="primary"
      slot="calc-button"
      (click)="opponentLeftAcknowledge.emit()"
    >
      Zurück zur Lobby
    </calc-button>
  </calc-flyout>
}
