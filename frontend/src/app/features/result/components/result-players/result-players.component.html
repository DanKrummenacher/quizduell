<ul class="results-list" aria-label="Endstand">
  @for (player of players(); track player.isMe) {
    <li
      class="player-result-card"
      [class.state-win]="player.cardState === 'win'"
      [class.state-loss]="player.cardState === 'loss'"
    >
      <span class="avatar" [class.is-me]="player.isMe" aria-hidden="true">{{
        initial(player.name)
      }}</span>
      <span class="name">
        <span class="name-text" [title]="player.name">{{ player.name }}</span>
        @if (player.isMe) {
          <span class="you"> (Du)</span>
        }
      </span>
      <span class="points">{{ player.score }}<span class="unit"> Pkt.</span></span>
    </li>
  }
</ul>
