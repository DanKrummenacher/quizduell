<header class="header-container">
  <div class="header-content">
    <calc-logo class="logo"></calc-logo>
    <calc-text textMedium textLead class="separator">|</calc-text>
    <calc-text textMedium textLead class="header-title">Quizduell Challenge</calc-text>
  </div>
</header>

<main class="main-content">
  <h1 class="main-title">Teste dein Wissen im direkten Duell</h1>

  <calc-text class="subtitle">
    Fordere dein logisches Denken heraus und zeige dein Können.
  </calc-text>

  <div class="features-row">
    <div class="feature-item">
      <div class="feature-circle">
        <calc-icon icon="survey" class="feature-icon"></calc-icon>
      </div>
      <calc-text textMedium textLead class="feature-text">7 Fragen</calc-text>
    </div>

    <div class="feature-item">
      <div class="feature-circle">
        <calc-icon icon="time-limit" class="feature-icon"></calc-icon>
      </div>
      <calc-text textMedium textLead class="feature-text">20s / Frage</calc-text>
    </div>

    <div class="feature-item">
      <div class="feature-circle">
        <calc-icon icon="lightning-strike" class="feature-icon"></calc-icon>
      </div>
      <calc-text textMedium textLead class="feature-text">1 vs 1</calc-text>
    </div>
  </div>

  <div class="input-section">
    <calc-input-text
      id="playerName"
      label="Dein Name"
      placeholder="z.B. Max Mustermann"
      class="name-input">
    </calc-input-text>

    <calc-button expanded variant="primary" class="start-button">
      <calc-icon icon="angle-right-circle" slot="icon"></calc-icon>
      los geht's
    </calc-button>

    <calc-text textMedium class="info-text">
      Direkt loslegen - kein Account nötig
    </calc-text>
  </div>
</main>
