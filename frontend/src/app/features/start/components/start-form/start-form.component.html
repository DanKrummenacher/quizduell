<div class="input-section">
  <css-input-text
    id="playerName"
    label="Dein Name"
    placeholder="z.B. Max Mustermann"
    autocomplete="nickname"
    [attr.maxlength]="maxLength"
    [value]="playerName"
    [errorMessage]="errorMessage || undefined"
    (input)="onNameInput($event)"
    (keydown)="onKeydown($event)"
  >
  </css-input-text>

  <css-button stretch variant="primary" class="start-button" (click)="submitForm()">
    <css-icon icon="angle-right-circle" slot="prefix"></css-icon>
    Los Geht's
  </css-button>

  @if (notice(); as message) {
    <calc-text textMedium class="notice-text" role="status">{{ message }}</calc-text>
  } @else {
    <calc-text textMedium class="info-text">
      Direkt loslegen - kein Account nötig
    </calc-text>
  }
</div>
