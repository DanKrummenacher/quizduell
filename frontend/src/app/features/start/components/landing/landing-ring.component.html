<app-landing-nav />

<main>
  <section class="hero">
    <div class="dial">
      <svg class="ticks" viewBox="0 0 200 200" aria-hidden="true">
        @for (angle of ticks; track angle) {
          <line
            class="tick"
            [class.is-filled]="$index < filledTicks()"
            x1="100"
            y1="4"
            x2="100"
            y2="16"
            [attr.transform]="'rotate(' + angle + ' 100 100)'"
          />
        }
      </svg>
      <div class="dial-center">
        <p class="kicker">
          <span class="count" aria-hidden="true">{{ remaining() }}</span> Sekunden
        </p>
        <h1 class="headline">
          Eine Frage.<br /><span class="accent">Wer weiss es?</span>
        </h1>
      </div>
    </div>

    <p class="lead">
      Im Quiz-Duell zählt jede Sekunde: {{ questions() }} Fragen, je
      {{ seconds() }} Sekunden, 1 gegen 1 in Echtzeit.
    </p>
    <app-landing-name-form
      [initialName]="initialName()"
      [notice]="notice()"
      (startGame)="startGame.emit($event)"
    />
  </section>

  <section class="rules" aria-label="Die Regeln">
    <div class="rule">
      <strong>{{ questions() }}</strong>
      <span>Fragen pro Duell</span>
    </div>
    <div class="rule">
      <strong>{{ seconds() }}<small>s</small></strong>
      <span>Zeit pro Frage</span>
    </div>
    <div class="rule">
      <strong>+1</strong>
      <span>für jede richtige Antwort</span>
    </div>
  </section>
</main>
