<main class="cover">
  <header class="masthead">
    <p class="issue">
      <span>Ausgabe 01</span>
      <span>Das Quiz-Duell</span>
      <span class="live"><i></i>Live</span>
    </p>
    <p class="title" aria-hidden="true"><span class="light">play</span>duelio</p>
  </header>

  <div class="body">
    <h1 class="headline">
      <span class="light">Bist du</span>
      schneller?
    </h1>

    <ul class="lines">
      <li>
        <b>{{ questions() }} Fragen</b> und am Ende ein Sieger
      </li>
      <li>
        <b>{{ seconds() }} Sekunden</b> pro Frage – reicht das?
      </li>
      <li><b>Kein Account.</b> Nur dein Name.</li>
    </ul>

    <button type="button" class="badge" (click)="focusForm($event)">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <path
            id="badgeCircle"
            d="M 50,50 m -37,0 a 37,37 0 1,1 74,0 a 37,37 0 1,1 -74,0"
          />
        </defs>
        <text>
          <textPath href="#badgeCircle">
            Jetzt spielen • 1 gegen 1 • Live • Jetzt spielen • 1 gegen 1 • Live •
          </textPath>
        </text>
      </svg>
      <span class="badge-core">
        <css-icon icon="arrow-right-circle" size="lg"></css-icon>
        <span class="visually-hidden">Zum Namensfeld</span>
      </span>
    </button>
  </div>

  <section class="sign-up" aria-labelledby="coverForm">
    <h2 id="coverForm" class="sign-up-title">Dein Name, dein Duell.</h2>
    <app-landing-name-form
      [initialName]="initialName()"
      [notice]="notice()"
      (startGame)="startGame.emit($event)"
    />
  </section>
</main>
