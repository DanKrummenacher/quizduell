<app-lobby-ui
  [state]="lobbyState()"
  [playerName]="playerName()"
  [roomCode]="roomCode()"
  [opponentName]="opponentName()"
  [countdownMs]="countdownMs()"
  [joinError]="joinError()"
  [opponentLeft]="opponentLeft()"
  [notice]="notice()"
  [design]="design()"
  [modeLayout]="modeLayout()"
  [gameFacts]="gameFacts()"
  (navigateBack)="handleBack()"
  (selectQuickGame)="handleSelectQuickGame()"
  (selectFriendGame)="handleSelectFriendGame()"
  (createGame)="handleCreate()"
  (joinGame)="handleJoin($event)"
  (cancelSearch)="handleCancelSearch()"
  (acknowledgeOpponentLeft)="handleOpponentLeftAcknowledge()"
  (acknowledgeNotice)="handleNoticeAcknowledge()"
>
</app-lobby-ui>

<!-- TEMPORARY: compare lobby designs (development only). -->
@if (showDesignPreview) {
  <app-lobby-design-panel
    [(design)]="design"
    [(screen)]="previewScreen"
    [(mode)]="modeLayout"
  />
}
