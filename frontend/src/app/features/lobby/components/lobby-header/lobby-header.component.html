<div class="top-bar">
  <css-button variant="plain" class="back-button" (click)="navigateBack.emit()">
    <css-icon icon="angle-left-circle" slot="prefix"></css-icon>
    Zurück
  </css-button>
</div>

@if (showGreeting()) {
  <h1 class="greeting-title">Hallo {{ playerName() }}</h1>
  <calc-text textMedium class="greeting-subtitle"
    >Fordere jemanden heraus!</calc-text
  >
}
