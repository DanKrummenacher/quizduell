<div class="page-wrapper">
  <app-brand-header />

  @if (hasNavigation()) {
    <div class="header-area">
      <app-lobby-header
        [playerName]="playerName()"
        (navigateBack)="navigateBack.emit()"
      />
    </div>
  }

  <main class="main-area">
    <div class="centered-content">
      @switch (state()) {
        @case ('CHOOSE_MODE') {
          <app-lobby-mode
            (selectQuickGame)="selectQuickGame.emit()"
            (selectFriendGame)="selectFriendGame.emit()"
          />
        }
        @case ('CHOOSE_ACTION') {
          <app-lobby-actions
            [joinError]="joinError()"
            (createGame)="createGame.emit()"
            (joinGame)="joinGame.emit($event)"
          />
        }
        @case ('SEARCHING') {
          <app-lobby-searching (cancelSearch)="cancelSearch.emit()" />
        }
        @case ('WAITING') {
          <app-lobby-waiting [roomCode]="roomCode()" />
        }
        @case ('FOUND') {
          <app-lobby-match-found
            [playerName]="playerName()"
            [opponentName]="opponentName()"
            [durationMs]="countdownMs()"
          />
        }
      }
    </div>
  </main>
</div>

@if (opponentLeft()) {
  <css-flyout
    withoutCloseButton
    size="small"
    title="Schade! Lobby geschlossen"
    main="Dein Gegner hat die Lobby verlassen. Du kannst nun ein neues Spiel starten oder einen neuen Gegner suchen."
  >
    <css-button
      variant="primary"
      slot="css-button"
      (click)="acknowledgeOpponentLeft.emit()"
    >
      Zurück zur Lobby
    </css-button>
  </css-flyout>
}

@if (notice(); as message) {
  <css-flyout withoutCloseButton size="small" title="Hinweis" [main]="message">
    <css-button
      variant="primary"
      slot="css-button"
      (click)="acknowledgeNotice.emit()"
    >
      OK
    </css-button>
  </css-flyout>
}
