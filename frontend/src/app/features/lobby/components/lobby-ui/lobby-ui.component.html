<div class="page-wrapper">
  @if (state() === 'CHOOSE_ACTION' || state() === 'WAITING') {
    <div class="header-area">
      <app-lobby-header
        [playerName]="playerName()"
        (navigateBack)="navigateBack.emit()"
      >
      </app-lobby-header>
    </div>
  }

  <main class="main-area">
    <div class="centered-content">
      @if (state() === 'CHOOSE_ACTION') {
        <app-lobby-actions
          [joinError]="joinError()"
          (createGame)="createGame.emit()"
          (joinGame)="joinGame.emit($event)"
        >
        </app-lobby-actions>
      } @else if (state() === 'WAITING') {
        <app-lobby-waiting [roomCode]="roomCode()"></app-lobby-waiting>
      } @else if (state() === 'FOUND') {
        <app-lobby-match-found
          [opponentName]="opponentName()"
        ></app-lobby-match-found>
      }
    </div>
  </main>
</div>
