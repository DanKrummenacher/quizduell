<h2 class="section-title">Spielmodus</h2>

<button type="button" class="choice-card" (click)="selectQuickGame.emit()">
  <span class="choice-block" aria-hidden="true">
    <css-icon icon="lightning-strike" size="lg"></css-icon>
  </span>
  <span class="choice-text">
    <span class="choice-title">Schnellspiel 1 vs 1</span>
    <span class="choice-description">Spiele gegen einen zufälligen Gegner</span>
  </span>
</button>

<button type="button" class="choice-card" (click)="selectFriendGame.emit()">
  <span class="choice-block" aria-hidden="true">
    <css-icon icon="conference" size="lg"></css-icon>
  </span>
  <span class="choice-text">
    <span class="choice-title">Freund herausfordern</span>
    <span class="choice-description">Erstelle oder tritt einem Spiel bei</span>
  </span>
</button>
