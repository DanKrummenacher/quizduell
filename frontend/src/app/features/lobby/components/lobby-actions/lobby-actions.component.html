<h2 class="section-title">Freund herausfordern</h2>

<button type="button" class="choice-card" (click)="createGame.emit()">
  <span class="choice-block" aria-hidden="true">
    <css-icon icon="add" size="lg"></css-icon>
  </span>
  <span class="choice-text">
    <span class="choice-title">Spiel erstellen</span>
    <span class="choice-description">Du bekommst einen Code für deinen Freund</span>
  </span>
</button>

<p class="or"><span>oder</span></p>

<section aria-labelledby="joinTitle">
  <h3 id="joinTitle" class="join-title">Code eingeben</h3>
  <p class="join-text">Den Code hat dir dein Freund geschickt</p>

  <!-- Four boxes; one real field lies invisibly over them. -->
  <div
    class="code-boxes"
    [class.is-joining]="joining()"
    [class.has-error]="errorMessage()"
  >
    <label class="visually-hidden" for="friendCode">Code deines Freundes</label>
    <input
      #codeField
      id="friendCode"
      class="code-field"
      type="text"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
      [readOnly]="joining()"
      [attr.maxlength]="codeLength"
      [attr.aria-invalid]="errorMessage() ? true : null"
      aria-describedby="friendCodeStatus"
      (input)="onCodeInput($event)"
      (focus)="focused.set(true)"
      (blur)="focused.set(false)"
    />
    @for (slot of slots; track slot) {
      <span
        class="code-box"
        [class.is-filled]="code().length > slot"
        [class.is-waiting]="focused() && !joining() && code().length === slot"
        [style.--i]="slot"
        aria-hidden="true"
      >
        <!-- Created when the box fills, so the character rolls in. -->
        @if (code()[slot]; as char) {
          <span class="char">{{ char }}</span>
        }
      </span>
    }
  </div>

  <!-- Keeps its height, so nothing jumps when a message appears. -->
  <p
    id="friendCodeStatus"
    class="code-status"
    [class.is-error]="errorMessage()"
    role="status"
  >
    @if (errorMessage(); as error) {
      {{ error }}
    } @else if (joining()) {
      <span class="spinner" aria-hidden="true"></span>
      Verbinde&nbsp;…
    }
  </p>
</section>
