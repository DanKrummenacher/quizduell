<div role="status">
  <!-- Both players move together; the check confirms the match. -->
  <div class="visual" aria-hidden="true">
    <div class="duo">
      <span class="glow"></span>
      <span class="avatar is-me">{{ myInitial() }}</span>
      <span class="avatar is-opponent">{{ opponentInitial() }}</span>
      <span class="badge"><css-icon icon="checkmark" size="sm"></css-icon></span>
    </div>
  </div>

  <h2 class="section-title status-title">Verbunden!</h2>
  <p class="body-text">
    Du spielst gegen <strong class="opponent-name">{{ opponentName() }}</strong>
  </p>

  <!-- Screen readers get the countdown as a sentence. -->
  <p class="visually-hidden">
    @if (countdown() > 0) {
      Das Duell beginnt in {{ countdown() }} Sekunden
    } @else {
      Los geht’s!
    }
  </p>

  <!-- The countdown, where the search had its cancel button. -->
  <div class="countdown" aria-hidden="true">
    @for (second of [countdown()]; track second) {
      @if (second > 0) {
        <span class="countdown-number">{{ second }}</span>
      } @else {
        <span class="countdown-number is-go">Los!</span>
      }
    }
  </div>
</div>
