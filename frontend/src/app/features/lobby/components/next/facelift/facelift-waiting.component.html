<h2 class="section-title">Spiel erstellt</h2>
<p class="body-text">Teile diesen Code mit deinem Freund</p>

<!-- The boxes of «Code eingeben», filled with your code. -->
<div class="code-boxes" role="text" [attr.aria-label]="'Code ' + roomCode()">
  @for (char of chars(); track $index) {
    <span class="code-box" [style.--i]="$index" aria-hidden="true"
      ><span class="char">{{ char }}</span></span
    >
  }
</div>

<css-button
  variant="plain"
  class="copy-button"
  [attr.disabled]="isCopied() ? true : null"
  (click)="!isCopied() && copyCode()"
>
  <css-icon
    [attr.icon]="isCopied() ? 'checked-circle' : 'copy'"
    slot="prefix"
  ></css-icon>
  {{ isCopied() ? 'Kopiert!' : 'Code kopieren' }}
</css-button>

<div class="waiting" role="status">
  <p class="waiting-text">Warte auf deinen Freund&nbsp;…</p>
  <span class="bar" aria-hidden="true"><i></i></span>
</div>
