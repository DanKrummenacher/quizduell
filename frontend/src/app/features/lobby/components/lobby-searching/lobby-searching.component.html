<div class="search-box-wrapper">
  <div class="search-box">
    <calc-icon icon="search" class="search-icon"></calc-icon>
  </div>
</div>

<calc-text textLarge textLead class="title-text">Suche Gegner...</calc-text>

<calc-text textMedium class="subtitle-text"
  >Warte auf einen weiteren Spieler</calc-text
>

<div class="loading-animation-wrapper">
  <div class="loading-circle"></div>
  <div class="loading-circle"></div>
  <div class="loading-circle"></div>
</div>

<div class="cancel-wrapper">
  <calc-button
    variant="primary"
    ariaLabel="Abbrechen"
    class="cancel-button"
    (click)="cancelSearch.emit()"
  >
    <calc-icon icon="delete" slot="icon"></calc-icon>
    Abbrechen
  </calc-button>
</div>
