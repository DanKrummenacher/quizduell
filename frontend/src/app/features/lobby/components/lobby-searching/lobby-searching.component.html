<div role="status">
  <div class="dial">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      @for (angle of ticks; track angle) {
        <line
          class="tick"
          [class.is-filled]="$index < filledTicks()"
          x1="100"
          y1="8"
          x2="100"
          y2="22"
          [attr.transform]="'rotate(' + angle + ' 100 100)'"
        />
      }
    </svg>
    <div class="dial-center">
      <span class="dial-time">{{ elapsed() }}</span>
      <span class="dial-label">Wartezeit</span>
    </div>
  </div>

  <h2 class="section-title status-title">Suche Gegner&nbsp;…</h2>
  <p class="body-text">
    Du wirst automatisch verbunden,<br />sobald jemand bereit ist
  </p>
</div>

<css-button variant="primary" class="compact-button" (click)="cancelSearch.emit()">
  <css-icon icon="close" slot="prefix"></css-icon>
  Abbrechen
</css-button>
